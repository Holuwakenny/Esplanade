<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Esplanade 6 Works Tracker</title>
    <meta name="description" content="Site coordination and close-out outstanding works tracker for Esplanade 6 with Python backend and Cloud database." />
    <meta property="og:title" content="Esplanade 6 Works Tracker" />
    <meta property="og:description" content="Site coordination and close-out outstanding works tracker for Esplanade 6 with Python backend and Cloud database." />
    <meta name="theme-color" content="#071D49" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GMH Tracker" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <script>
      // Suppress Vite HMR WebSocket errors in cloud iframe environment
      (function() {
        function isWsError(err) {
          if (!err) return false;
          var str = (typeof err === 'string' ? err : (err.message || '') + ' ' + (err.stack || '') + ' ' + String(err)).toLowerCase();
          return str.indexOf('websocket') !== -1 || str.indexOf('ws://') !== -1 || str.indexOf('wss://') !== -1 || str.indexOf('vite') !== -1 && str.indexOf('connect') !== -1;
        }
        window.addEventListener('unhandledrejection', function (event) {
          if (isWsError(event.reason)) {
            event.preventDefault();
            event.stopImmediatePropagation && event.stopImmediatePropagation();
          }
        }, true);
        window.addEventListener('error', function (event) {
          if (isWsError(event.message) || isWsError(event.error)) {
            event.preventDefault();
            event.stopImmediatePropagation && event.stopImmediatePropagation();
          }
        }, true);
      })();

      // Register PWA Service Worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').then(function(reg) {
            console.log('[PWA] Service Worker registered with scope:', reg.scope);
          }).catch(function(err) {
            console.warn('[PWA] Service Worker registration notice:', err);
          });
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
